<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  html,body{width:1200px;height:630px;overflow:hidden;background:#F6F5F2;color-scheme:light}
  :root{--bg:#F6F5F2;--surface:#fff;--text:#1B1D22;--text2:#5B6069;--text3:#767B85;--line:rgba(27,29,34,.08);--accent-text:#D4562F}
  .og{display:grid;grid-template-columns:560px 1fr;gap:28px;height:630px;padding:56px 56px 56px 64px}
  .l{display:flex;flex-direction:column;justify-content:center}
  .l img{width:96px;height:96px;filter:drop-shadow(0 12px 18px rgba(200,80,40,.35))}
  .l h1{margin-top:30px;font:700 60px/1.22 var(--display);letter-spacing:-.01em}
  .l h1 em{font-style:normal;color:var(--accent-text)}
  .l p{margin-top:20px;font-size:22px;color:var(--text2)}
  .r{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:14px}
  .r .t{grid-column:auto!important;grid-row:auto!important;display:flex!important}
  .r .t .c{font-size:15px}
  .r .t.code{grid-column:1/3!important}
  .r .t.code pre{font-size:12.5px}
</style>
</head>
<body>
<div class="og">
  <div class="l">
    <img src="../assets/icon-256.webp" alt="">
    <h1>複製過的東西，<br>再也<em>不會不見</em>。</h1>
    <p>iPhone・iPad・Mac 的剪貼簿歷史</p>
  </div>
  <div class="r">
    <article class="t" style="--tint:var(--k-link)">
      <div class="meta"><span class="time">09:12</span>Safari<span class="kind"><svg class="i"><use href="#i-link"/></svg>連結</span></div>
      <div class="c"><p class="ttl">App Intents 文件</p><p class="url">developer.apple.com</p></div>
    </article>
    <article class="t color" style="--tint:var(--k-color)">
      <div class="meta"><span class="time">09:40</span>Figma<span class="kind"><svg class="i"><use href="#i-color"/></svg>顏色</span></div>
      <div class="c"><div class="sw" style="--sw:#FF7B4F"><span>#FF7B4F</span></div></div>
    </article>
    <article class="t code" style="--tint:var(--k-code)">
      <div class="meta"><span class="time">10:03</span>Xcode<span class="kind"><svg class="i"><use href="#i-code"/></svg>程式碼</span></div>
      <div class="c"><pre><code><span class="kw">func</span> <span class="fn">debounce</span>(_ interval: TimeInterval,
              action: <span class="kw">@escaping</span> () -> Void)</code></pre></div>
    </article>
    <article class="t mask" style="--tint:var(--k-text)">
      <div class="meta"><span class="time">14:32</span>備忘錄<span class="kind"><svg class="i"><use href="#i-lock"/></svg>已遮罩</span></div>
      <div class="c"><span class="dots mono">••••••••</span><small>偵測到信用卡號</small></div>
    </article>
    <article class="t" style="--tint:var(--k-email)">
      <div class="meta"><span class="time">15:48</span>郵件<span class="kind"><svg class="i"><use href="#i-mail"/></svg>Email</span></div>
      <div class="c" style="display:flex;align-items:center">lin.yating@studio-ko.tw</div>
    </article>
  </div>
</div>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.6 9.4a2.7 2.7 0 0 0 3.8 0l2.2-2.2a2.7 2.7 0 0 0-3.8-3.8l-.8.8"/><path d="M9.4 6.6a2.7 2.7 0 0 0-3.8 0L3.4 8.8a2.7 2.7 0 0 0 3.8 3.8l.8-.8"/></symbol>
  <symbol id="i-code" viewBox="0 0 16 16"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></symbol>
  <symbol id="i-color" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><circle cx="6" cy="6.6" r=".6"/><circle cx="9.6" cy="6" r=".6"/><circle cx="10.6" cy="9" r=".6"/></symbol>
  <symbol id="i-mail" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1.8"/><path d="m3 4.5 5 4 5-4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.6"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></symbol>
</svg>
</body>
</html>
